[package]
name = "ladoo"
version = "0.1.0"
edition = "2021"
description = "A Rust backend framework prioritizing simplicity and developer experience"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/ladoo"
keywords = ["web", "framework", "http", "server", "async"]
categories = ["web-programming::http-server"]

[features]
default = ["json", "macros", "config", "logging", "cache", "jobs",
           "auth", "cors", "rate-limit", "secure-headers", "validation"]
json = ["dep:serde", "dep:serde_urlencoded"]
auth = ["dep:subtle"]
auth-jwt = ["auth", "dep:jsonwebtoken", "dep:serde"]
cors = []
rate-limit = ["dep:dashmap"]
secure-headers = []
config = ["dep:toml"]
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:uuid"]
cache = ["dep:serde", "dep:dashmap"]
jobs = []
macros = ["dep:ladoo-macros"]
validation = ["dep:validator"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:rustls-pki-types"]
test-server = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
bytes = "1"
dashmap = { version = "6", optional = true }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
jsonwebtoken = { version = "9", optional = true }
ladoo-macros = { path = "../ladoo-macros", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Required (not optional) because the health module produces JSON unconditionally.
# All other JSON usage is gated behind the `json` feature.
serde_json = "1"
serde_urlencoded = { version = "0.7", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
rustls = { version = "0.23", optional = true }
rustls-pemfile = { version = "2", optional = true }
rustls-pki-types = { version = "1", optional = true }
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-rustls = { version = "0.26", optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
validator = { version = "0.19", features = ["derive"], optional = true }

[dev-dependencies]
# Enables `test-server` for this crate's own integration tests (e.g.
# `tests/http2_test.rs`), which need a real TCP server (`App::spawn`)
# to exercise HTTP/2 over the wire — the in-memory `TestClient` can't
# negotiate a wire protocol.
ladoo = { path = ".", features = ["test-server"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
validator = { version = "0.19", features = ["derive"] }
