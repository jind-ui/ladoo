[package]
name = "ladoo-jobs"
version = "0.1.0"
edition = "2021"
description = "Database-backed persistent job queue with Postgres and SQLite backends"
license = "MIT OR Apache-2.0"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "sqlx/postgres"]
sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, optional = true, features = ["runtime-tokio", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
