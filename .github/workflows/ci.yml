name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - no-default-features
          - all-features
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: |
          case "${{ matrix.features }}" in
            default)            cargo test -p ladoo -p ladoo-macros -p ladoo-jobs ;;
            no-default-features) cargo test -p ladoo --no-default-features && cargo test -p ladoo-jobs --no-default-features ;;
            all-features)       cargo test -p ladoo -p ladoo-macros --all-features && cargo test -p ladoo-jobs --all-features ;;
          esac

  clippy:
    name: Clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - no-default-features
          - all-features
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: |
          case "${{ matrix.features }}" in
            default)            cargo clippy -p ladoo -p ladoo-macros -p ladoo-jobs -- -D warnings ;;
            no-default-features) cargo clippy -p ladoo --no-default-features -- -D warnings && cargo clippy -p ladoo-jobs --no-default-features -- -D warnings ;;
            all-features)       cargo clippy -p ladoo -p ladoo-macros --all-features -- -D warnings && cargo clippy -p ladoo-jobs --all-features -- -D warnings ;;
          esac

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check
